<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro — Estoque</title>
</head>
<body>
    <h1>Criar conta</h1>

    {% if erro %}
        <p style="color: red;">{{ erro }}</p>
    {% endif %}

    <form action="/auth/register" method="post">
        <label>Nome:
            <input type="text" name="nome" required>
        </label>
        <br>
        <label>E-mail:
            <input type="email" name="email" required>
        </label>
        <br>
        <label>Senha:
            <input type="password" name="senha" required minlength="4">
        </label>
        <br>
        <button type="submit">Cadastrar</button>
    </form>

    <p>Já tem conta? <a href="/auth/login">Entrar</a></p>
</body>
</html>
